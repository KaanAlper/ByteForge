name: Release

# Bir sürüm etiketi (v0.1.0 gibi) push'landığında tüm platformlar için
# kurulumları derler ve bir GitHub Release'e yükler. Elle de tetiklenebilir.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (arm64)
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel (x86_64)
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04 # geniş glibc uyumu (AppImage)
            args: ""
          - platform: windows-latest # msi + nsis (.exe)
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux sistem bağımlılıkları
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Derle & Release'e yükle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater imzalama (minisign) — repo secret'ları
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ByteForge ${{ github.ref_name }}"
          releaseBody: |
            ByteForge ${{ github.ref_name }} — çoklu platform kurulumlar aşağıda.

            - **Windows:** `.msi` veya `.exe` (setup)
            - **macOS:** `.dmg` (Apple Silicon + Intel ayrı)
            - **Linux:** `.AppImage` (taşınabilir), `.deb`, `.rpm`

            Linux tek satır kurulum:
            ```
            curl -fsSL https://raw.githubusercontent.com/KaanAlper/ByteForge/master/install.sh | bash
            ```
          releaseDraft: false
          includeUpdaterJson: true
          prerelease: false
          args: ${{ matrix.args }}

[package]
name = "byteforge-core"
version = "0.1.1"
edition = "2021"

[dependencies]
zip = "2"
axmldecoder = "0.5"
sha2 = "0.10"
goblin = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
yaxpeax-arch = "0.3.2"
yaxpeax-arm = "0.4.0"
yaxpeax-x86 = "2.2.0"
yara-x = "1.20.0"

[dev-dependencies]
tempfile = "3"
